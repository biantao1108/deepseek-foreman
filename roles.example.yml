# deepseek-foreman 角色表（外部配置文件）
#
# 插件每次执行 pick_route 前都会重新看这个文件的 mtime：
# 改完保存，下一次调用立即生效，不用重启 dsh。文件写坏了也不会炸——
# 插件保留上一份可用角色表，并在返回值里说明错在哪，改好自动恢复。
#
# 怎么用
#   把下面「组合 A」或「组合 B」里其中一组的注释解开（两组只解一组，
#   同时解开会得到两个顶层 roles: 键，YAML 会判重复键而报错），
#   再把 provider / model 换成你自己的路由名，保存即生效。
#
# 字段说明（每条角色都能用，缺省值见括号）
#   role             角色键。模型调 pick_route 时传的名字，如 foreman / daily-code / review。
#   vendor           厂商键。只用于「异族审查」判定：同 vendor 的写手与审查者不能互审。
#                    同一家厂商的不同模型，vendor 要填同一个值。
#   provider         交给 subagent 工具的路由 provider（必填）。
#   model            该 provider 下的模型 id（必填）。
#   reasoningEffort  推理档位，如 high / medium / low；留空（默认）用模型自己的默认档。
#   vision           是否支持读图/截图（默认 false）。带图的活派给 false 的角色会被拒。
#   maxOutputTokens  声明的单次输出上限（默认 0 = 不声明，跳过长产出检查）。
#                    整篇长产出派给上限小于 100000 的角色会被拒。
#   peakWindows      高峰时段，格式 "HH:MM-HH:MM"，可写多段（默认空 = 不限时段）。
#   peakDays         高峰时段生效的星期，ISO 编号 1=周一 … 7=周日（默认空 = 每天都算）。
#   holidays         全天不算高峰的日期，格式 YYYY-MM-DD（默认空）。
#   fallback         本角色被拒时建议改派的角色键（默认空 = 不给建议）。
#   note             给模型看的说明：这个角色干什么、要注意什么。
#
# 两个硬提醒
#   1. provider / model 必须是当前 dsh 会话 allowedModels 白名单里已有的路由，
#      否则 subagent 调用会被白名单拦下；白名单是会话创建时的快照，改完要开新会话。
#   2. 出厂模板里没有任何真实路由名，provider / model 全是占位符，请自己填。

# ── 组合 A：单一厂商全家桶（自家模型分档；审查必须另找一家厂商，否则同族审查会被拒）
# roles:
#   - role: foreman
#     vendor: vendor-a
#     provider: PROVIDER_A            # ← 换成你的 provider
#     model: MODEL_FOREMAN            # ← 换成你的模型
#     reasoningEffort: high
#     note: 经理位。不写代码，只看工单、回执和审查意见。
#   - role: daily-code
#     vendor: vendor-a
#     provider: PROVIDER_A
#     model: MODEL_CODE
#     vision: true
#     peakWindows:                    # 便宜档只在非高峰时段放行
#       - 09:00-12:00
#       - 14:00-18:00
#     peakDays: [1, 2, 3, 4, 5]
#     holidays:
#       - 2026-01-01
#     fallback: chores
#     note: 日常实现。便宜、有视觉；高峰时段会被拒并改派 chores。
#   - role: chores
#     vendor: vendor-a
#     provider: PROVIDER_A
#     model: MODEL_CHEAP
#     maxOutputTokens: 65536
#     note: 杂活。窗口小，别塞大上下文，也别要求整篇长文。
#   - role: review
#     vendor: vendor-b                # ← 审查换一家厂商，否则同族审查会被拒
#     provider: PROVIDER_B
#     model: MODEL_REVIEW
#     note: 只读审查。只找真问题，附文件:行号 + 证据。

# ── 组合 B：多厂商混合（经理 / 施工 / 审查分属三家，谁跟谁都不算同族）
# roles:
#   - role: foreman
#     vendor: vendor-a
#     provider: PROVIDER_A
#     model: MODEL_FOREMAN
#     note: 经理位。
#   - role: daily-code
#     vendor: vendor-b
#     provider: PROVIDER_B
#     model: MODEL_CODE
#     vision: true
#     note: 日常实现，带视觉。
#   - role: review
#     vendor: vendor-c
#     provider: PROVIDER_C
#     model: MODEL_REVIEW
#     vision: true
#     note: 异族只读审查。
#   - role: copywriting
#     vendor: vendor-b
#     provider: PROVIDER_B
#     model: MODEL_TEXT
#     note: 中文文案、看图识别。

# ─────────────────────────────────────────────────────────────
# 组合 C：秘书模式（对话用最便宜模型，高阶模型只做判断）
#
# 适用于「你日常闲聊很多、真正写代码不多」的场景：
# 会话模型切到最便宜档并贴 persona.secretary.example.md，
# 它把你的大白话整理成需求包（目标/边界不做/成功信号/已定决策四要素），
# subagent 派给 foreman 角色干活——聊天 token 全按便宜档计费，
# 高阶模型的上下文里只有这份需求包（放不下时内容落 _tickets/req-*.md，包里只留要素+路径）。
#
# 关键约束（照抄即可生效）：
#   · foreman 用的厂商必须能派 subagent 且在白名单内；
#   · review 与 foreman 必须不同厂商（否则同族硬拒），
#     所以 foreman = A 家时 review 用 B 家、review-alt 用 C 家（它审 foreman 的产物，不能跟 foreman 同族）；
#   · 施工角色与 foreman 同厂商也没问题（只有审查要跨族）。
#
# - role: foreman
#   vendor: vendor-a
#   provider: PROVIDER_A
#   model: MODEL_FOREMAN
#   vision: true
#   note: 经理位。只读工单/回执/审查意见，不看代码细节。
# - role: foreman-backup
#   vendor: vendor-b
#   provider: PROVIDER_B
#   model: MODEL_PRO
#   note: 经理备位。foreman 额度用尽时把 foreman 一行改指它（改一行、热更新）。
# - role: daily-code
#   vendor: vendor-c
#   provider: PROVIDER_C
#   model: MODEL_FLASH
#   vision: true
#   reasoningEffort: high
#   note: 主力施工。
# - role: review
#   vendor: vendor-b
#   provider: PROVIDER_B
#   model: MODEL_PRO
#   vision: true
#   note: 审 vendor-a 产物（与 foreman 跨族）。critical 单走物理只读实例。
# - role: review-alt
#   vendor: vendor-c
#   provider: PROVIDER_C
#   model: MODEL_PRO
#   vision: true
#   note: 审 foreman 自己的产物（foreman=vendor-a，这里必须换族）。
