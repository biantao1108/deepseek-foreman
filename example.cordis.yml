# 把本插件装进 dsh 桌面版 profile 的样子。
# 1) 先让插件包可被解析：桌面版 Plugins 页装 npm 包，或本地 link。
# 2) 把下面这段并进 ~/.dsh/profiles/desktop/cordis.patch.yml。
# 3) 改完必须开新会话（allowedModels 白名单在会话创建时快照）。
#
# 这是「老接法」示意：在 config 里指定角色表，下面两种方式二选一。
# 出厂模板里没有任何真实路由名，provider / model 请换成你自己白名单里的路由。
# 字段完整说明见 roles.example.yml。

- id: foreman
  name: 'deepseek-foreman'
  config:
    # ── 方式 a（推荐）：把角色表外置成文件 ─────────────────────────────
    # 插件每次执行 pick_route 前查该文件的 mtime，改完保存即生效，不用重启。
    # 文件不存在时会自动铺一份带中文注释的模板（内容同包内 roles.example.yml），
    # 并进入「未配置」引导态，直到你按注释填好 provider / model。
    # 开头写 ~/ 会展开成家目录；本行整行注释掉则用默认位置 ~/.dsh/foreman.roles.yml。
    # rolesFile: ~/.dsh/foreman.roles.yml

    # ── 方式 b（内联，兼容旧接法）：直接在 config 里写角色表 ───────────
    # 内联 roles 非空时优先，rolesFile 会被忽略。下面只留一条占位角色，
    # 真实角色表的写法（多角色、异族审查、时段限制等）见 roles.example.yml。
    # roles:
    #   - role: lead
    #     vendor: vendor-a
    #     provider: YOUR_PROVIDER
    #     model: YOUR_MODEL
    #     note: 占位示例。完整字段说明见 roles.example.yml。
